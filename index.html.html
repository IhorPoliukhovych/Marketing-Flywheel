<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive marketing flywheel: why ads alone lose money and when referrals turn the business profitable.">
<title>Marketing Flywheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: title row, six summary tiles (free clients in gold), then wheel plus this-month box on the left and forecast plus the balance curve on the right. Business fields and the story log in one strip below. Phone: everything stacks. */
:root {
  --bg: #E8ECEF;
  --panel: #F5F7F8;
  --ink: #17232C;
  --muted: #586873;
  --line: #C6D0D6;
  --accent: #B9801A;
  --accent-ink: #1B1304;
  --loss: #B0382B;
  --gain: #1F7A55;
  --iron: #2B3841;
  --f-display: 'Unbounded', 'Onest', system-ui, sans-serif;
  --f-body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161B; --panel: #182027; --ink: #E6ECEF; --muted: #93A3AE; --line: #2B3842;
    --accent: #E2AE45; --accent-ink: #1B1304; --loss: #EE7B6B; --gain: #4CC08C; --iron: #6B7E8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161B; --panel: #182027; --ink: #E6ECEF; --muted: #93A3AE; --line: #2B3842;
  --accent: #E2AE45; --accent-ink: #1B1304; --loss: #EE7B6B; --gain: #4CC08C; --iron: #6B7E8A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.45;
  padding-block: 16px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.head { display: flex; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; min-width: 0; flex: 1; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.3rem, 3vw, 1.75rem); line-height: 1.15; letter-spacing: -.01em; }
.lede { margin: 0; font-size: 13.5px; color: var(--muted); flex: 1 1 280px; min-width: 0; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); flex: none; }
.lang button { font: inherit; font-family: var(--f-mono); font-weight: 600; font-size: 12.5px; min-height: 36px; min-width: 46px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lang button:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
.lang button[aria-pressed="true"]:focus-visible { outline-color: var(--bg); }

/* summary tiles */
.sum { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1000px) { .sum { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
.tile { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--ink); border-radius: 8px; padding: 8px 12px 10px; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tile .tl { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile .tv { font-family: var(--f-display); font-weight: 500; font-size: clamp(1rem, 1.6vw, 1.15rem); line-height: 1.3; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .ts { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.tile.hl { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tile.hl .tl, .tile.hl .ts { color: var(--accent-ink); opacity: .85; }
.tile.hl .tv { font-weight: 700; font-size: clamp(1.25rem, 2.2vw, 1.6rem); }

.main { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 14px; align-items: start; }
.bottom { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 900px) { .main, .bottom { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.panel h2 { margin: 0; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* wheel */
.wheel-wrap { position: relative; }
.wheel-wrap svg { display: block; width: 100%; height: auto; max-width: 170px; margin: 0 auto; }
.w-iron { stroke: var(--iron); }
.w-fill { fill: var(--iron); }
.w-line { stroke: var(--line); }
.w-glow { stroke: var(--accent); }
.w-wa { fill: var(--accent); }
.hub-bg { fill: var(--panel); stroke: var(--iron); }
.hub-n { font-family: var(--f-mono); font-weight: 600; font-size: 21px; fill: var(--ink); text-anchor: middle; }
.hub-s { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); text-anchor: middle; }
.float { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); font-family: var(--f-mono); font-weight: 600; font-size: 1rem; color: var(--loss); pointer-events: none; animation: floatUp 1.1s ease-out forwards; }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -40px); } }
.hubcap { margin: 0; text-align: center; font-size: 11px; color: var(--muted); }
.state { margin: 4px 0 0; font-family: var(--f-display); font-weight: 500; font-size: 1rem; text-align: center; }
.state-sub { margin: 2px 0 0; color: var(--muted); text-align: center; text-wrap: balance; min-height: 2.8em; font-size: 12.5px; line-height: 1.4; }

/* this month */
.month { margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; background: var(--bg); }
.month.loss { border-left-color: var(--loss); }
.month.gain { border-left-color: var(--gain); }
.mhead { display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mv { display: block; font-family: var(--f-display); font-weight: 500; font-size: 1.55rem; line-height: 1.25; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ms { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
.neg { color: var(--loss); }
.pos { color: var(--gain); }

/* fields */
.fld { display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; min-width: 0; }
.fld label { font-size: 12.5px; font-weight: 500; line-height: 1.25; }
.inp { display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.inp:focus-within { outline: 2px solid var(--ink); outline-offset: 1px; }
.inp input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums; outline: none; padding: 6px 0; }
.inp input::placeholder { color: var(--muted); opacity: .55; }
.inp .u { color: var(--muted); font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }
.budget { margin-top: 10px; }
.chk { display: flex; align-items: center; gap: 8px; min-height: 34px; cursor: pointer; font-size: 13px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }

.btn { font: inherit; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn.primary { width: 100%; min-height: 48px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; font-size: 1rem; }
.btn.primary small { font-weight: 500; font-size: 11.5px; opacity: .8; white-space: nowrap; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }

.fh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.fh .sp { flex: 1; min-width: 8px; }
.fh .pl { font-size: 12.5px; color: var(--muted); }
.pnote { margin: 6px 0 8px; font-size: 12.5px; color: var(--muted); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 10px; }
.fgroup { margin: 6px 0 8px; font-size: 12.5px; color: var(--muted); max-width: 80ch; }
.adv { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 8px; }
.adv summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.adv summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.derived { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.derived b { font-weight: 600; }
.funnel { font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

/* chart */
.chead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: baseline; gap: 6px; }
.sw { display: inline-block; width: 16px; height: 0; border-top: 2.5px solid var(--ink); flex: none; align-self: center; }
.sw.dash { border-top: 2.5px dashed var(--muted); }
.forecast { margin: 6px 0 4px; font-size: 13px; color: var(--muted); min-height: 2.9em; }
.forecast b { color: var(--ink); font-weight: 600; }
.readout { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 0 0 4px; min-height: 2.8em; font-size: 12.5px; color: var(--muted); align-items: baseline; align-content: flex-start; }
.readout b { color: var(--ink); font-weight: 600; }
.readout i { font-style: normal; font-family: var(--f-mono); font-weight: 500; }
.readout i.fr { background: var(--accent); color: var(--accent-ink); padding: 0 6px; border-radius: 4px; font-weight: 600; }
.chart { touch-action: pan-y; min-width: 0; }
.chart svg { display: block; }
.ax { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.grid-l { stroke: var(--line); stroke-width: 1; opacity: .7; }
.zero-l { stroke: var(--muted); stroke-width: 1.2; }
.aline { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.gline { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 5; stroke-linejoin: round; }
.area-g { fill: var(--gain); opacity: .22; }
.area-l { fill: var(--loss); opacity: .22; }
.dot { fill: var(--ink); stroke: var(--panel); stroke-width: 2; }
.guide { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.band-t { font-family: var(--f-body); font-size: 11px; fill: var(--muted); }
.mark-t { font-family: var(--f-body); font-size: 11.5px; fill: var(--ink); font-weight: 500; }
.hatch-l { stroke: var(--muted); stroke-width: 1.2; opacity: .35; }

.log { list-style: none; margin: 8px 0 0; padding: 0; max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.log li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; font-size: 13px; line-height: 1.4; }
.log .m { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); padding-top: 1px; }
.log .empty { display: block; color: var(--muted); grid-column: 1 / -1; }

.assump { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.assump summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.assump summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.note { margin: 10px 0 0; font-size: 13px; color: var(--muted); max-width: 90ch; }

/* funnel strip */
.own-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 8px 0 12px; }
@media (max-width: 760px) { .own-stats { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.funnel-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .funnel-strip { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.fvr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.cv { font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.cv:empty { display: none; }
.ms.pos, .ms.neg { font-weight: 500; }

/* empty required fields pulse */
.inp.need { border-color: var(--accent); animation: need 1.5s ease-in-out infinite; }
@keyframes need { 0%, 100% { box-shadow: 0 0 0 0 var(--accent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); } }
.btn.primary.fill { animation: needb 1.5s ease-in-out infinite; }
@keyframes needb { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent); } }

/* teaching tip */
.tip { border: 1px solid var(--accent); border-left-width: 6px; border-radius: 8px; background: var(--panel); padding: 12px 14px; animation: tipIn .35s ease-out; }
.tip-t { margin: 0 0 4px; font-family: var(--f-display); font-weight: 500; font-size: 1rem; }
.tip-b { margin: 0; font-size: 13.5px; line-height: 1.5; max-width: 75ch; }
.tip-b b { font-weight: 600; }
.tip-f { margin-top: 10px; display: flex; justify-content: flex-end; }
.tip .btn { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; min-width: 130px; }
@keyframes tipIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@media (max-width: 900px) { .tip { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20; box-shadow: 0 10px 34px rgba(0, 0, 0, .3); max-height: 70vh; overflow: auto; } }

@media (prefers-reduced-motion: reduce) { .float { animation: none; display: none; } .btn:active:not(:disabled) { transform: none; } .inp.need, .btn.primary.fill, .tip { animation: none; } .inp.need { box-shadow: 0 0 0 2px var(--accent); } }
</style>
</head>
<body>


<main class="page">
  <div class="top">
    <header class="head">
      <h1 data-i18n="h1"></h1>
      <p class="lede" data-i18n="lede"></p>
    </header>
    <div class="lang" role="group" aria-label="Мова / Language">
      <button type="button" data-lang="uk" aria-pressed="false">UA</button>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
    </div>
  </div>

  <section class="funnel-strip" aria-label="Funnel">
    <div class="tile"><span class="tl" data-i18n="fsLeads"></span><span class="fvr"><span class="tv" id="fsL"></span></span><span class="ts" id="fsLS"></span></div>
    <div class="tile"><span class="tl" data-i18n="fsAppts"></span><span class="fvr"><span class="tv" id="fsA"></span><span class="cv" id="fsAc"></span></span><span class="ts" id="fsAS"></span></div>
    <div class="tile"><span class="tl" data-i18n="fsSales"></span><span class="fvr"><span class="tv" id="fsC"></span><span class="cv" id="fsCc"></span></span><span class="ts" id="fsCS"></span></div>
  </section>

  <section class="sum" aria-label="Summary">
    <div class="tile"><span class="tl" data-i18n="sumInvested"></span><span class="tv" id="tInv"></span><span class="ts" id="tInvS"></span></div>
    <div class="tile"><span class="tl" data-i18n="sumPaid"></span><span class="tv" id="tPaid"></span><span class="ts" id="tPaidS"></span></div>
    <div class="tile hl"><span class="tl" data-i18n="sumFree"></span><span class="tv" id="tFree"></span><span class="ts" id="tFreeS"></span></div>
    <div class="tile"><span class="tl" data-i18n="sumCost"></span><span class="tv" id="tCost"></span><span class="ts" id="tCostS"></span></div>
    <div class="tile"><span class="tl" data-i18n="sumEarned"></span><span class="tv" id="tEarn"></span><span class="ts" id="tEarnS"></span></div>
    <div class="tile"><span class="tl" data-i18n="sumPayback"></span><span class="tv" id="tPay"></span><span class="ts" id="tPayS"></span></div>
  </section>

  <div class="main">
    <section class="panel" aria-label="Wheel and controls">
      <div class="wheel-wrap" id="wheelWrap">
        <svg viewBox="0 0 400 376" id="wheelSvg" role="img">
          <path class="w-iron" d="M200 190 L132 360 M200 190 L268 360" stroke-width="10" stroke-linecap="round" fill="none"/>
          <rect class="w-fill" x="104" y="358" width="192" height="12" rx="3"/>
          <g id="rotor">
            <circle class="w-iron" cx="200" cy="190" r="150" fill="none" stroke-width="24"/>
            <circle id="glow" class="w-glow" cx="200" cy="190" r="150" fill="none" stroke-width="24" opacity="0"/>
            <circle class="w-line" cx="200" cy="190" r="131" fill="none" stroke-width="2"/>
            <g class="w-iron" stroke-width="8" stroke-linecap="round">
              <line x1="200" y1="190" x2="200" y2="52"/>
              <line x1="200" y1="190" x2="200" y2="52" transform="rotate(45 200 190)"/>
              <line x1="200" y1="190" x2="200" y2="52" transform="rotate(90 200 190)"/>
              <line x1="200" y1="190" x2="200" y2="52" transform="rotate(135 200 190)"/>
              <line x1="200" y1="190" x2="200" y2="52" transform="rotate(180 200 190)"/>
              <line x1="200" y1="190" x2="200" y2="52" transform="rotate(225 200 190)"/>
              <line x1="200" y1="190" x2="200" y2="52" transform="rotate(270 200 190)"/>
              <line x1="200" y1="190" x2="200" y2="52" transform="rotate(315 200 190)"/>
            </g>
            <circle class="w-wa" cx="200" cy="40" r="9"/>
            <circle class="w-fill" cx="350" cy="190" r="9"/>
            <circle class="w-fill" cx="200" cy="340" r="9"/>
            <circle class="w-fill" cx="50" cy="190" r="9"/>
          </g>
          <circle class="hub-bg" cx="200" cy="190" r="47" stroke-width="6"/>
          <text id="hubNum" class="hub-n" x="200" y="193">—</text>
          <text id="hubSub" class="hub-s" x="200" y="212"></text>
        </svg>
      </div>
      <p class="hubcap" id="hubcap" data-i18n="hubcap"></p>
      <p class="state" id="state" aria-live="polite"></p>
      <p class="state-sub" id="stateSub"></p>

      <div class="month" id="monthBox">
        <div class="mhead"><span id="mLabel"></span><span id="mTime"></span></div>
        <b class="mv" id="mVal">—</b>
        <span class="ms" id="mSub1"></span>
        <span class="ms" id="mSub2"></span>
        <span class="ms" id="mSub3"></span>
      </div>

      <div class="fld budget">
        <label for="fB" data-i18n="fB"></label>
        <div class="inp"><span class="u">$</span><input id="fB" type="number" inputmode="decimal" min="0" step="any" placeholder="3000"><span class="u" data-i18n="perMonth"></span></div>
      </div>
      <label class="chk"><input type="checkbox" id="adsOn" checked><span data-i18n="adsOn"></span></label>
      <button class="btn primary" id="btnStep" type="button"><span id="stepLabel"></span><small id="stepSmall" data-i18n="oneMonth"></small></button>
      <div class="row3">
        <button class="btn" id="btnYear" type="button" data-i18n="btnYear"></button>
        <button class="btn" id="btnAuto" type="button"></button>
        <button class="btn" id="btnReset" type="button" data-i18n="btnReset"></button>
      </div>
      <label class="chk"><input type="checkbox" id="tipsOn" checked><span data-i18n="tipsLbl"></span></label>
    </section>

    <div class="col">
    <aside class="tip" id="tip" role="status" aria-live="polite" hidden>
      <p class="tip-t" id="tipT"></p>
      <p class="tip-b" id="tipB"></p>
      <div class="tip-f"><button class="btn" id="tipOk" type="button" data-i18n="tipOk"></button></div>
    </aside>
    <section class="panel" aria-label="Forecast and chart">
      <div class="chead">
        <h2 data-i18n="chartsTitle"></h2>
        <div class="legend">
          <span><i class="sw"></i><span data-i18n="legPast"></span></span>
          <span><i class="sw dash"></i><span id="legGhost"></span></span>
        </div>
      </div>
      <p class="forecast" id="forecast"></p>
      <p class="readout" id="readout" aria-live="off"></p>

      if (q.live > 0) {
        var nref = n >= 3 ? (rows[n - 1].net + rows[n - 2].net + rows[n - 3].net) / 3 : net, okL = nref >= q.live;
        $('#mSub3').textContent = okL ? t('mLiveOk', money(q.live), money(nref - q.live)) : t('mLiveGap', Math.max(0, Math.round(nref / q.live * 100)), money(q.live - nref));
        $('#mSub3').className = 'ms ' + (okL ? 'pos' : 'neg');
      }
    }

    /* controls */
    var blocked = miss.length > 0;
    $('#stepLabel').textContent = blocked ? t('stepFill') : (fut > 0 ? t('stepOn', money(fut)) : t('stepOff'));
    $('#stepSmall').textContent = blocked ? '↓' : t('oneMonth');
    $('#legGhost').textContent = fut > 0 ? t('legGhostOn', money(fut)) : t('legGhostOff');
    $('#forecast').innerHTML = forecastHTML(full, n, miss);
    var atMax = n >= MAX;
    $('#btnStep').disabled = atMax; $('#btnStep').classList.toggle('fill', blocked && !atMax); $('#btnYear').disabled = atMax || blocked; $('#btnAuto').disabled = atMax || blocked;
    if ((atMax || blocked) && auto) stopAuto();
    $('#btnAuto').textContent = auto ? t('btnPause') : t('btnAuto');
    $('#pnote').textContent = preset === 'blank' ? t('pnBlank') : preset ? t('pnExample') : t('pnOwn');
    $$('[data-preset]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-preset') === preset ? 'true' : 'false'); });
    updateDerived();
    var needs = needIds();
    REQ.forEach(function (r) { $('#' + r[0]).parentNode.classList.toggle('need', needs.indexOf(r[0]) >= 0); });
    var own = ownerInfo(full, n, miss);
    $('#ownText').innerHTML = own.html; $('#ownText').hidden = own.chart; state.ownerOn = own.chart; $('#charts2').hidden = !own.chart; $('#ownStats').hidden = !own.chart;
    if (own.chart) {
      $('#osCanV').textContent = own.canV; $('#osCanV').className = 'tv ' + (own.yes ? 'pos' : 'neg'); $('#osCanS').textContent = own.canS;
      $('#osNeedV').textContent = own.needV; $('#osNeedV').className = 'tv ' + (own.needZero ? 'pos' : 'neg'); $('#osNeedS').textContent = own.needS;
      $('#osAfterV').textContent = own.afterV; $('#osAfterV').className = 'tv ' + (own.afterNeg ? 'neg' : 'pos'); $('#osAfterS').textContent = own.afterS;
    }

    var ev = buildEvents(rows), lg = $('#log');
    if (!ev.length) lg.innerHTML = '<li><span class="empty">' + t('logEmpty') + '</span></li>';
    else lg.innerHTML = ev.slice().reverse().map(function (e) { return '<li><span class="m">' + t('moTag') + ' ' + e.m + '</span><span>' + e.t + '</span></li>'; }).join('');

    drawCharts();
  }

  /* ---------- static text, inputs, storage ---------- */
  function applyStatic() {
    document.documentElement.lang = lang;
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    $('#wheelSvg').setAttribute('aria-label', t('wheelAria'));
    $$('[data-tip]').forEach(function (el) { el.title = t(el.getAttribute('data-tip')); });
    $$('[data-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-ph')); });
    $$('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
  }
  function writeInputs() {
    FIELDS.forEach(function (f) { $('#' + f[0]).value = S[f[1]] == null ? '' : S[f[1]]; });
    $('#adsOn').checked = !!S.adsOn; $('#rnd').checked = !!S.random;
  }
  /* ---------- teaching tips ---------- */
  var tipsOn = true, shown = {}, tipKey = null, tipInfo = null;
  function fpb(B, n) {
    var old = S.B; S.B = B;
    var full = sim(spends.concat(new Array(Math.max(0, MAX - n)).fill(B)), n);
    S.B = old;
    var pb = paybackOf(full);
    return (pb && full[full.length - 1].cum >= 0) ? pb : null;
  }
  function lessonDue() {
    if (!tipsOn) return null;
    var rows = sim(spends, spends.length), n = rows.length, i;
    if (!n) return null;
    var last = rows[n - 1];
    if (!shown.loss && n >= 2 && last.cum < 0 && last.pdC >= 1 && last.frC < 1) { shown.loss = 1; return 'loss'; }
    if (!shown.free && last.frC >= 1) { shown.free = 1; return 'free'; }
    if (!shown.small && n >= 12 && last.s > 0 && last.cum < 0) {
      var B = effBudget(), cur = fpb(B, n);
      if (cur === null || cur > 84) {
        var ms = [1.5, 2, 3, 4];
        for (i = 0; i < ms.length; i++) {
          var p = fpb(B * ms[i], n);
          if (p !== null && p <= 120 && (cur === null || p <= cur * 0.7)) {
            shown.small = 1; tipInfo = { b: money(B), cur: cur ? timeStr(cur) : null, b2: money(B * ms[i]), p2: timeStr(p) };
            return 'small';
          }
        }
      }
    }
    if (!shown.stop && last.s === 0) {
      var k = n - 1, peak = 0;
      while (k >= 0 && rows[k].s === 0) k--;
      var streak = n - 1 - k;
      for (i = 0; i <= k; i++) peak = Math.max(peak, rows[i].freeE);
      if (k >= 0 && streak >= 3 && peak >= 0.3 && last.freeE <= peak * 0.9) {
        shown.stop = 1; tipInfo = { n: streak, a: Math.round((1 - last.freeE / peak) * 100), x: money(rows[k].net, true), y: money(last.net, true) };
        return 'stop';
      }
    }
    return null;
  }
  function showTip(key) {
    var q = derived(), T, B;
    if (key === 'loss') { T = t('tipLossT'); B = t('tipLossB', money(q.costPaid), money(q.G), q.G - q.costPaid); }
    else if (key === 'free') { T = t('tipFreeT'); B = t('tipFreeB', money(q.G), money(q.costPaid)); }
    else if (key === 'small') { T = t('tipSmallT'); B = t('tipSmallB', tipInfo.b, tipInfo.cur, tipInfo.b2, tipInfo.p2); }
    else { T = t('tipStopT'); B = t('tipStopB', tipInfo.n, tipInfo.a, tipInfo.x, tipInfo.y); }
    tipKey = key;
    $('#tipT').textContent = T; $('#tipB').innerHTML = B;
    $('#tip').hidden = false;
    if ($('#tip').scrollIntoView) $('#tip').scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  }
  function hideTip() { tipKey = null; $('#tip').hidden = true; }
  function focusNeed() {
    var ids = needIds(); if (!ids.length) return;
    var el = $('#' + ids[0]);
    el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
    el.focus({ preventScroll: true });
  }

  /* ---------- actions ---------- */
  function floatText(txt) {
    if (reduce) return;
    var el = document.createElement('span'); el.className = 'float'; el.textContent = txt;
    $('#wheelWrap').appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1200);
  }
  function advance(k) {
    if (missing().length) { focusNeed(); return; }
    hideTip();
    var total = 0, c = 0, b = effBudget(), due = null;
    while (c < k && spends.length < MAX) { spends.push(b); total += b; c++; due = lessonDue(); if (due) break; }
    if (!c) return;
    if (!reduce && b > 0) w += Math.min(90, 18 + total / 60);
    if (total > 0) floatText('−' + money(total));
    render();
    if (due) { stopAuto(); showTip(due); }
  }
  function stopAuto() { clearInterval(auto); auto = null; $('#btnAuto').textContent = t('btnAuto'); }
  function toggleAuto() {
    if (auto) { stopAuto(); return; }
    $('#btnAuto').textContent = t('btnPause');
    auto = setInterval(function () { advance(1); }, 320);
  }
  function loadPreset(name) {
    stopAuto();
    S = Object.assign({}, PRESETS[name]); preset = name; spends = []; hoverM = null; shown = {}; hideTip();
    writeInputs(); render();
  }

  $('#btnStep').addEventListener('click', function () { advance(1); });
  $('#btnYear').addEventListener('click', function () { advance(12); });
  $('#btnAuto').addEventListener('click', toggleAuto);
  $('#btnReset').addEventListener('click', function () { stopAuto(); spends = []; hoverM = null; shown = {}; hideTip(); render(); });
  $('#tipOk').addEventListener('click', hideTip);
  $('#tipsOn').addEventListener('change', function (e) { tipsOn = e.target.checked; if (!tipsOn) hideTip(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && tipKey) hideTip(); });
  $$('[data-preset]').forEach(function (b) { b.addEventListener('click', function () { loadPreset(b.getAttribute('data-preset')); }); });
  $$('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); setFmt(); applyStatic(); render(); if (tipKey) showTip(tipKey); });
  });
  FIELDS.forEach(function (f) {
    $('#' + f[0]).addEventListener('input', function (e) {
      var raw = e.target.value, v = parseFloat(raw);
      S[f[1]] = (raw === '' || !isFinite(v)) ? null : v;
      preset = null; render();
    });
  });
  $('#adsOn').addEventListener('change', function (e) { S.adsOn = e.target.checked; render(); });
  $('#rnd').addEventListener('change', function (e) { S.random = e.target.checked; preset = null; render(); });

  var ch = $('#charts');
  function setHover(e) {
    var r = e.currentTarget.getBoundingClientRect(), pw = r.width - ML - MR;
    var x = (e.clientX - r.left - ML) / pw * state.xmax;
    hoverM = Math.min(state.xmax, Math.max(1, Math.ceil(x)));
    drawCharts();
  }
  ch.addEventListener('pointermove', setHover);
  ch.addEventListener('pointerdown', setHover);
  ch.addEventListener('pointerleave', function () { hoverM = null; drawCharts(); });
  var ch2 = $('#charts2');
  ch2.addEventListener('pointermove', setHover); ch2.addEventListener('pointerdown', setHover);
  ch2.addEventListener('pointerleave', function () { hoverM = null; drawCharts(); });
  if (window.ResizeObserver) new ResizeObserver(function () { drawCharts(); }).observe(ch);

  /* ---------- wheel animation ---------- */
  var rotor = $('#rotor');
  function frame(ts) {
    var dt = Math.min(0.05, (ts - lastT) / 1000); lastT = ts;
    w += (target - w) * (1 - Math.exp(-dt / 1.4));
    if (Math.abs(w) < 0.05 && target === 0) w = 0;
    ang = (ang + w * dt) % 360;
    rotor.setAttribute('transform', 'rotate(' + ang.toFixed(2) + ' 200 190)');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setFmt(); applyStatic(); writeInputs(); render();
})();
</script>

</body>
